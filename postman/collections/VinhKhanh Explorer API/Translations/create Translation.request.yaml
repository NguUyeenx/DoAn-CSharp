$kind: http-request
name: create Translation
method: POST
url: "{{baseUrl}}/api/translations"
body:
  type: json
  content: "{\r

    \  \"poiId\": 1,\r

    \  \"languageCode\": \"en\",\r

    \  \"name\": \"Pho Bo Special\",\r

    \  \"shortDescription\": \"Premium Vietnamese beef noodle soup\",\r

    \  \"fullDescription\": \"A delicious bowl of Pho...\",\r

    \  \"audioText\": \"Welcome to Pho Bo Special...\"\r

    }\r\n"
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 1000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response has translation data", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData).to.be.an('object');
      });
    language: text/javascript
