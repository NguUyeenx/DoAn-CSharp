$kind: http-request
name: Delete Menu Item
method: DELETE
url: "{{baseUrl}}/api/pois/{{poiId}}/menu/5"
order: 4000
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 204", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 204]);
      });
    language: text/javascript
