$kind: http-request
name: Update Menu Item
method: PUT
url: '{{baseUrl}}/api/pois/{{poiId}}/menu/{{menuItemId}}'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Pho Bo Special",
      "description": "Premium Vietnamese beef noodle soup",
      "price": 65000,
      "category": "Main Course",
      "available": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
