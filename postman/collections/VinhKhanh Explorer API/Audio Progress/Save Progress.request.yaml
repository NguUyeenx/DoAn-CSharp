$kind: http-request
name: Save Progress
method: PUT
url: "{{baseUrl}}/api/audio-progress"
order: 2000
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "audioFileId": 1,
      "currentSecond": 45.5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
