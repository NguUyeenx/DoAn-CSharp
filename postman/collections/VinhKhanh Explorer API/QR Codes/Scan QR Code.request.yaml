$kind: http-request
name: Scan QR Code
method: POST
url: "{{baseUrl}}/api/qr/scan/VKE-POI-001"
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response has POI data", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData).to.be.an('object');
      });
    language: text/javascript
