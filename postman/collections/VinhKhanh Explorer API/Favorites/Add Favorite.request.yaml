$kind: http-request
name: Add Favorite
method: POST
url: "{{baseUrl}}/api/favorites/1"
order: 2000
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 201", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
    language: text/javascript
