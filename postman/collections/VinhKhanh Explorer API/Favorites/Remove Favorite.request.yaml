$kind: http-request
name: Remove Favorite
method: DELETE
url: "{{baseUrl}}/api/favorites/1"
order: 3000
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 204", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 204]);
      });
    language: text/javascript
