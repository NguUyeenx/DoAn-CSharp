$kind: http-request
name: Nearby POIs
method: GET
url: '{{baseUrl}}/api/pois/nearby'
order: 3000
queryParams:
  - key: lat
    value: '10.762622'
  - key: lng
    value: '106.660172'
  - key: r
    value: '500'
  - key: lang
    value: en
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response is array", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData).to.be.an('array');
      });
