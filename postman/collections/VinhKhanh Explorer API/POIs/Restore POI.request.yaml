$kind: http-request
name: Restore POI
method: POST
url: '{{baseUrl}}/api/pois/{{poiId}}/restore'
order: 9000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
