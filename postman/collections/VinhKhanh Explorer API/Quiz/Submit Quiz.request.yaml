$kind: http-request
name: Submit Quiz
method: POST
url: "{{baseUrl}}/api/quizzes/submit"
order: 2000
queryParams:
  lang: en
headers:
  Content-Type: application/json
body:
  type: json
  content: |
    {
      "quizQuestionId": 1,
      "selectedOption": "A"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response has score or correct field", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData).to.satisfy(function(data) {
          return data.hasOwnProperty('score') || data.hasOwnProperty('correct');
        });
      });
    language: text/javascript
